<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Astral Crystal – Idle</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #0b1d3a, #020817);
      height: 100%;
      font-family: Arial, sans-serif;
      color: #dff6ff;
    }

    .top {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      font-size: 14px;
    }

    .center {
      height: calc(100% - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crystal {
      width: 14px;
      height: 90px;
      background: linear-gradient(180deg, #7ffcff, #1bb6ff);
      border-radius: 8px;
      box-shadow: 0 0 25px #35d9ff;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    .info {
      text-align: center;
      font-size: 14px;
      opacity: 0.85;
    }

    .bottom {
      position: fixed;
      bottom: 40px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    button {
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      border: none;
      padding: 14px 26px;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 0 15px #00cfff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      box-shadow: none;
    }

    footer {
      position: fixed;
      bottom: 8px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      opacity: 0.4;
    }
  </style>
</head>

<body>

  <div class="top">
    <div>💎 Kristal: <span id="crystal">0</span></div>
    <div>⚡ Seviye: <span id="level">1</span></div>
  </div>

  <div class="center">
    <div class="crystal"></div>
  </div>

  <div class="info">
    ⏱️ Saniyede +<span id="rate">1</span>
  </div>

  <div class="bottom">
    <button id="upgradeBtn">
      ⬆️ Güçlendir (10 Kristal)
    </button>
  </div>

  <footer>
    Astral Crystal · Idle Prototype
  </footer>

<script>
  let crystal = parseInt(localStorage.getItem("crystal")) || 0;
  let rate = parseInt(localStorage.getItem("rate")) || 1;
  let level = parseInt(localStorage.getItem("level")) || 1;

  const crystalEl = document.getElementById("crystal");
  const rateEl = document.getElementById("rate");
  const levelEl = document.getElementById("level");
  const upgradeBtn = document.getElementById("upgradeBtn");

  function render() {
    crystalEl.textContent = crystal;
    rateEl.textContent = rate;
    levelEl.textContent = level;
    upgradeBtn.disabled = crystal < 10;
  }

  setInterval(() => {
    crystal += rate;
    save();
    render();
  }, 1000);

  upgradeBtn.onclick = () => {
    if (crystal >= 10) {
      crystal -= 10;
      rate += 1;
      level += 1;
      save();
      render();
    }
  };

  function save() {
    localStorage.setItem("crystal", crystal);
    localStorage.setItem("rate", rate);
    localStorage.setItem("level", level);
  }

  render();
</script>

</body>
</html>
