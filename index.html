<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Astral Crystal</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at top, #0b1d3a, #020617);
        color: #e0f2ff;
        font-family: Arial, sans-serif;
        height: 100%;
        overflow: hidden;
    }

    #game {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
    }

    .top {
        width: 100%;
        display: flex;
        justify-content: space-between;
        font-size: 18px;
    }

    .crystal-area {
        position: relative;
        width: 220px;
        height: 220px;
        perspective: 800px;
    }

    .crystal {
        width: 160px;
        height: 160px;
        margin: auto;
        background: linear-gradient(135deg, #7dd3fc, #38bdf8, #0ea5e9);
        clip-path: polygon(
            50% 0%,
            85% 25%,
            100% 60%,
            50% 100%,
            0% 60%,
            15% 25%
        );
        animation: spin 6s linear infinite;
        box-shadow: 0 0 40px rgba(56,189,248,0.8);
    }

    @keyframes spin {
        from { transform: rotateY(0deg) rotateX(10deg); }
        to { transform: rotateY(360deg) rotateX(10deg); }
    }

    .stats {
        text-align: center;
        font-size: 20px;
        margin-top: 10px;
    }

    button {
        width: 100%;
        max-width: 300px;
        padding: 14px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #22d3ee, #0ea5e9);
        color: #021024;
        font-weight: bold;
        box-shadow: 0 6px 15px rgba(34,211,238,0.5);
        cursor: pointer;
    }

    button:active {
        transform: scale(0.97);
    }

    .footer {
        font-size: 14px;
        opacity: 0.7;
    }
</style>
</head>

<body>
<div id="game">
    <div class="top">
        <div>💎 Kristal: <span id="crystal">0</span></div>
        <div>⚡ Seviye: <span id="level">1</span></div>
    </div>

    <div class="crystal-area">
        <div class="crystal"></div>
    </div>

    <div class="stats">
        ⏱️ Saniyede +<span id="rate">1</span>
    </div>

    <button onclick="upgrade()">⬆️ Güçlendir (10 Kristal)</button>

    <div class="footer">
        Astral Crystal • Idle Prototype
    </div>
</div>

<script>
    let crystal = 0;
    let level = 1;
    let rate = 1;

    const crystalEl = document.getElementById("crystal");
    const levelEl = document.getElementById("level");
    const rateEl = document.getElementById("rate");

    function tick() {
        crystal += rate;
        crystalEl.textContent = crystal;
    }

    function upgrade() {
        if (crystal >= 10) {
            crystal -= 10;
            level++;
            rate++;
            crystalEl.textContent = crystal;
            levelEl.textContent = level;
            rateEl.textContent = rate;
        }
    }

    setInterval(tick, 1000);
</script>
</body>
</html>
